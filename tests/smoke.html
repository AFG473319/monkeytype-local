<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>monkeytype local &mdash; smoke tests</title>
<script>
/* capture runtime errors before anything else runs */
window.__errors = [];
window.__errHooked = false;
window.addEventListener("error", function (e) {
  window.__errors.push(String(e.message) + " @ " + (e.filename || "") + ":" + (e.lineno || 0));
});
window.addEventListener("unhandledrejection", function (e) {
  window.__errors.push("promise: " + String(e.reason));
});
window.__errHooked = true;
</script>
</head>
<body>
<script>
/* The suite used to mirror index.html's markup, which let broken markup hide from it:
   debug scripts appended to index.html never ran here. So load the real page instead:
   fetch index.html, add a <base> so js/ and css/ resolve from the repo root, re-arm the
   error capture, append tests/smoke.js, and write the result out as this document.
   Reading a local file needs either HTTP (python -m http.server) or
   --allow-file-access-from-files; both are documented in the README. */
var CAPTURE =
  '<script>window.__errors = window.__errors || [];' +
  'if (!window.__errHooked) {' +
  'window.__errHooked = true;' +
  'window.addEventListener("error", function (e) {' +
  'window.__errors.push(String(e.message) + " @ " + (e.filename || "") + ":" + (e.lineno || 0));' +
  '});' +
  'window.addEventListener("unhandledrejection", function (e) {' +
  'window.__errors.push("promise: " + String(e.reason));' +
  '});}' +
  '<\/script>';

function fail(message) {
  var pre = document.createElement("pre");
  pre.id = "smoke-report";
  pre.textContent =
    "SMOKE_RESULT failed=1 total=1\n" +
    "FAIL loaded index.html [" + message + "]\n" +
    "This page now runs the suite inside the real index.html. Serve the folder\n" +
    "(python -m http.server 4587) and open http://localhost:4587/tests/smoke.html,\n" +
    "or run headless with --allow-file-access-from-files as the README shows.";
  document.body.appendChild(pre);
  document.title = "SMOKE failed=1 total=1";
}

/* cache: "no-cache" matters: the suite must test the index.html on disk, not the
   one a previous visit happened to cache */
fetch("../index.html", { cache: "no-cache" })
  .then(function (res) {
    if (!res.ok) throw new Error("HTTP " + res.status);
    return res.text();
  })
  .then(function (html) {
    /* <base> goes first in <head> so the stylesheet link resolves too */
    html = html.replace(/<head[^>]*>/i, function (m) {
      return m + '<base href="../">' + CAPTURE;
    });
    html = html.replace(/<\/body>/i, function (m) {
      /* bust http caching of the harness itself so an edited smoke.js is always the
         one that runs; file:// keeps the plain path for --allow-file-access-from-files */
      var src = location.protocol === "file:" ? "tests/smoke.js" : "tests/smoke.js?b=" + Date.now();
      return '<script src="' + src + '"><\/script>' + m;
    });
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function (err) {
    fail(String(err && err.message || err));
  });
</script>
</body>
</html>
